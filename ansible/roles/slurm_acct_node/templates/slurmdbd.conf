#
# slurmdbd.conf file generated by ansible.
#
AuthType=auth/munge
DbdHost={{ inventory_hostname }}
DbdPort=6819
SlurmUser={{ slurm_user }}
PidFile=/var/run/slurmdbd.pid
LogFile=/var/log/slurmdbd.log
StorageType=accounting_storage/mysql
StorageHost=localhost
StoragePort=3306
StorageUser={{ slurm_acct_db_user }}
StoragePass={{ slurmdbd_mysql_password }}
StorageLoc={{ slurm_acct_db_name }}
