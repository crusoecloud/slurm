- name: Wait for hosts to become SSH reachable
  hosts: all
  remote_user: ubuntu
  gather_facts: false
  tasks:
    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

- name: Run pre-tasks
  hosts: all
  remote_user: ubuntu
  become: true
  roles:
    - pre_tasks
    - hostname

- name: Configure accounting nodes
  hosts: slurm_acct_nodes
  remote_user: ubuntu
  become: true
  roles:
    - slurm_acct_node

- name: Configure head nodes
  hosts: slurm_head_nodes
  remote_user: ubuntu
  become: true
  roles:
    - slurm_head_node
    - { role: observability,
        tags: ['observability'],
        when: enable_observability | default(false) | bool }

- name: Configure compute nodes
  hosts: slurm_compute_nodes
  remote_user: ubuntu
  become: true
  roles:
    - slurm_compute_node
    - { role: observability,
        tags: ['observability'],
        observability_prometheus_server: false,
        when: enable_observability | default(false) | bool }

- hosts: all
  remote_user: ubuntu
  become: true
  tasks:
    - name: "Add users"
      ansible.builtin.include_role:
        name: user
      vars:
        user_name: "{{ item.name }}"
        user_uid: "{{ item.uid }}"
        user_is_sudoer: "{{ item.is_sudoer | default(false) }}"
        user_ssh_pubkey: "{{ item.ssh_pubkey }}"
      loop: "{{ slurm_users | from_json }}"
      when: slurm_users is defined
